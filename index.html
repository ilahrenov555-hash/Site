<style>

  html[data-theme="dark"] {

    flex: none;
    width: 40px;

    border: 1px solid var(--border);

  /* ── главная ───────────────────────────── */
  .intro {

  .search {

  .search input {

<script>
/* ─────────── Статьи ───────────
   Чтобы добавить статью, скопируйте любой объект ниже
   и поменяйте slug, date, tags, title, excerpt и body.
   Slug — латиницей, без пробелов: он попадает в адрес страницы.
*/
const articles = [
  {
    slug: "zachem-vesti-zametki",
    date: "2026-11-18",
    tags: ["привычки", "мышление"],
    title: "Зачем вести заметки, если всё помнит телефон",
    excerpt: "Память хранит факты, но не связи между ними. Заметки — это способ думать медленнее и точнее.",
    body: `
      <p>Телефон помнит всё: пароли, встречи, номера. Но он не помнит, что вы подумали, когда читали статью в метро, и не связывает это с тем, что услышали через неделю.</p>
      <p>Заметка — не архив. Это место, где мысль останавливается на секунду и становится видимой. Пока мысль в голове, она кажется очевидной; на бумаге сразу видно, где она рвётся.</p>
      <h2>Три правила, которые сработали</h2>
      <ul>
        <li>Писать своими словами. Копипаста не думает.</li>
        <li>Одна заметка — одна мысль. Иначе потом не найти.</li>
        <li>Возвращаться раз в неделю и выкидывать лишнее.</li>
      </ul>
      <blockquote>Заметки нужны не для того, чтобы помнить, а для того, чтобы думать.</blockquote>
      <p>Через месяц такой практики становится заметно: вы перестаёте заново изобретать решения, которые уже находили. Это и есть главная выгода — не память, а экономия мышления.</p>
    `
  },
  {
    slug: "kak-chitat-bolshe",
    date: "2026-11-09",
    tags: ["чтение"],
    title: "Как читать больше, не читая быстрее",
    excerpt: "Скорость чтения почти не влияет на количество книг. Влияет то, что происходит до и после.",
    body: `
      <p>Соблазн простой: научиться читать в два раза быстрее и прочитать в два раза больше. На практике скорость растёт вместе с потерей смысла, и книгу приходится перечитывать.</p>
      <h2>Что работает лучше</h2>
      <p>Держать книгу там, где вы бываете без дела: у кровати, в рюкзаке, на телефоне. Пять минут в очереди — это тоже чтение, и за неделю их набирается на главу.</p>
      <p>Бросать книги без сожаления. Дочитывание из упрямства — самая дорогая привычка читателя: она съедает время, которое могло уйти на хорошее.</p>
      <p>И записывать одну фразу после каждой главы. Не конспект — одну фразу. Этого достаточно, чтобы книга осталась, а не прошла насквозь.</p>
    `
  },
  {
    slug: "odin-proekt",
    date: "2026-10-27",
    tags: ["работа", "фокус"],
    title: "Правило одного проекта",
    excerpt: "Пять начатых дел утомляют сильнее, чем одно сложное. Потому что каждое висит в памяти.",
    body: `
      <p>Незаконченные задачи занимают место в голове даже когда мы о них не думаем. Пять открытых проектов — это пять фоновых процессов, и ни один не получает полной мощности.</p>
      <h2>Как это выглядит на практике</h2>
      <ul>
        <li>В работе — один проект. Остальные лежат в списке «потом».</li>
        <li>«Потом» — это честный список, а не свалка: у каждого пункта есть следующее действие.</li>
        <li>Переключение разрешено, но осознанно: сначала закрыть текущий этап.</li>
      </ul>
      <p>Главный эффект не в скорости, а в спокойствии: когда проект один, о нём не надо помнить — он и так перед глазами.</p>
    `
  },
  {
    slug: "prostoy-tekst",
    date: "2026-10-14",
    tags: ["текст", "редактура"],
    title: "Простой текст — это не примитивный текст",
    excerpt: "Ясность требует работы, а не упрощения. Четыре приёма, которые делают черновик читаемым.",
    body: `
      <p>Кажется, что писать просто — значит писать короче и без терминов. Но простота появляется не от вычёркивания слов, а от ясности мысли: если непонятно, что вы хотите сказать, никакая редактура не спасёт.</p>
      <h2>Четыре приёма</h2>
      <ul>
        <li>Глагол вместо отглагольного существительного: «мы решили» лучше, чем «было принято решение».</li>
        <li>Одна мысль на абзац. Вторую — в следующий.</li>
        <li>Конкретика вместо оценки: не «значительно выросло», а «выросло вдвое».</li>
        <li>Прочитать вслух. Там, где спотыкаешься, — там плохо написано.</li>
      </ul>
      <blockquote>Хороший текст не замечаешь: замечаешь только плохой.</blockquote>
      <p>И последнее: первый абзац почти всегда лишний. Он нужен автору, чтобы разогреться, а не читателю.</p>
    `
  }
];

/* ─────────── Утилиты ─────────── */
const MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня",
                "июля", "августа", "сентября", "октября", "ноября", "декабря"];

function formatDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return d + " " + MONTHS[m - 1] + " " + y;
}

function readingTime(html) {
  const words = html.replace(/<[^>]*>/g, " ").trim().split(/\s+/).length;
  return Math.max(1, Math.round(words / 180)) + " мин чтения";
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* ─────────── Тема ─────────── */
const root = document.documentElement;
const themeBtn = document.getElementById("theme");

function applyTheme(name) {
  root.dataset.theme = name;
  themeBtn.textContent = name === "dark" ? "☀" : "☾";
  themeBtn.setAttribute("aria-label", name === "dark" ? "Светлая тема" : "Тёмная тема");
}

let saved = null;
try { saved = localStorage.getItem("theme"); } catch (e) {}
applyTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

themeBtn.addEventListener("click", () => {
  const next = root.dataset.theme === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("theme", next); } catch (e) {}
});

/* ─────────── Отрисовка ─────────── */
const view = document.getElementById("view");

function cardHTML(a) {
  return `
    <a class="post-card" href="#/post/${a.slug}">
      <div class="card-meta">
        <time datetime="${a.date}">${formatDate(a.date)}</time>
        ${a.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}
      </div>
      <h2>${esc(a.title)}</h2>
      <p>${esc(a.excerpt)}</p>
    </a>`;
}

function renderHome() {
  document.title = "Заметки — блог";
  view.innerHTML = `
    <section class="intro">
      <h1>Заметки о том, как думать и работать спокойнее</h1>
      <p>Короткие тексты о внимании, привычках и ясности. Без расписания — как появляется повод.</p>
    </section>
    <div class="search">
      <input id="q" type="search" placeholder="Поиск по статьям и тегам" autocomplete="off">
    </div>
    <div class="list" id="list">
      ${articles.map(cardHTML).join("")}
    </div>`;

  const q = document.getElementById("q");
  const list = document.getElementById("list");

  q.addEventListener("input", () => {
    const needle = q.value.trim().toLowerCase();
    const found = articles.filter(a =>
      (a.title + " " + a.excerpt + " " + a.tags.join(" ")).toLowerCase().includes(needle)
    );

    list.innerHTML = found.length
      ? found.map(cardHTML).join("")
      : `<div class="empty">Ничего не нашлось. Попробуйте другое слово.</div>`;
  });
}

function renderPost(slug) {
  const a = articles.find(x => x.slug === slug);

  if (!a) {
    document.title = "Статья не найдена";
    view.innerHTML = `
      <a class="back" href="#/">← Все статьи</a>
      <div class="empty">Такой статьи нет. Возможно, ссылка устарела.</div>`;
    return;
  }

  document.title = a.title + " — Заметки";
  view.innerHTML = `
    <a class="back" href="#/">← Все статьи</a>
    <article class="post">
      <div class="post-meta">
        <time datetime="${a.date}">${formatDate(a.date)}</time>
        <span>·</span>
        <span>${readingTime(a.body)}</span>
        ${a.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}
      </div>
      <h1>${esc(a.title)}</h1>
      ${a.body}
    </article>`;
}

function route() {
  const hash = location.hash.replace(/^#\/?/, "");

  if (hash.startsWith("post/")) {
    renderPost(decodeURIComponent(hash.slice(5)));
  } else {
    renderHome();
  }

  window.scrollTo(0, 0);
}

addEventListener("hashchange", route);
route();
</script>
</body>
